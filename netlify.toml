# The site is a plain static page in site/ — nothing to build. The explicit
# no-op command overrides any build command left in the Netlify dashboard
# from earlier eras of this repository.
#
# Deploy previews are switched off: reviewing a change means opening
# site/index.html in a browser, so PR builds add nothing. Netlify skips a
# build when the ignore command exits 0, which this does for every context
# except production (master).
[build]
  command = "echo 'No build needed: Cassandra is a static page in site/'"
  publish = "site"
  ignore = "test \"$CONTEXT\" != \"production\""
