# The site is a plain static page in site/ with nothing to build. The explicit
# no-op command overrides any build command left in the Netlify dashboard
# from earlier eras of this repository.
[build]
  command = "echo 'No build needed: Cassandra is a static page in site/'"
  publish = "site"
  # Deploy previews are off: reviewing a change to a buildless page means
  # opening site/index.html in a browser. Netlify skips a build when the
  # ignore command exits 0, which this does for every context except
  # production (master). Comment the line out to get previews back.
  ignore = "test \"$CONTEXT\" != \"production\""
